# SonarCloud configuration
# https://sonarsource.github.io/sonarcloud-github-action

# Organization key in SonarCloud (replace with your actual org key)
sonar.organization=alextransit

# Unique project identifier: must match the repository name on GitHub
sonar.projectKey=AlexTransit_vender

# Human-readable name and version
sonar.projectName=vender
sonar.projectVersion=0.260908.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Go sources to analyze (vendor/ is excluded automatically by SonarGo,
# but we list explicit exclusions just in case)
sonar.sources=.
sonar.exclusions=vendor/**,**/*.pb.go,evend-hardware/**

# Test files detection for Go
sonar.tests=.
sonar.test.inclusions=**/*_test.go
