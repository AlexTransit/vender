name: SonarCloud

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history is required for accurate new-code / PR decorations

      - name: Install ALSA dev headers
        # github.com/ebitengine/oto/v3 requires libasound2 (cgo) to build,
        # otherwise `go test ./...` fails with "Package 'alsa' not found".
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Optional step: build the project. Kept tolerant on purpose — analysis
      # should proceed even if some packages fail to build.
      - name: Build
        run: go build ./... || true

      # Optional step: run tests and produce coverage report.
      # SonarQube for Go reads Go's native coverage format out of the box.
      # Some packages (cmd/vender/*, ui, vmc) may still fail to build in CI;
      # their coverage will simply be missing from the report. The `|| true`
      # ensures a failing package never breaks the workflow or the scan.
      - name: Test with coverage
        continue-on-error: true
        run: |
          set -o pipefail
          go test -coverprofile=coverage.raw -covermode=atomic ./... 2>&1 | tail -n 50 || true
          # Ensure coverage.out exists and has a valid header so SonarCloud
          # doesn't choke when zero packages produced a profile.
          if [ -f coverage.raw ]; then
            cp coverage.raw coverage.out
          else
            echo 'mode: atomic' > coverage.out
          fi

      - name: Upload coverage artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      # IMPORTANT (SonarCloud project setting, not a code change):
      # This action performs a "CI analysis". If "Automatic Analysis" is also
      # enabled for the project on SonarCloud, the scan fails with exit code 3:
      #   ERROR You are running CI analysis while Automatic Analysis is enabled.
      # Before this step can succeed, turn Automatic Analysis OFF in the UI:
      #   https://sonarcloud.io/project/analysis_method?id=AlexTransit_vender
      #   -> General Settings -> Analysis Method -> Automatic Analysis = Off
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.go.coverage.reportPaths=coverage.out
